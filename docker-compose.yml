services:
  nw-overlap:
    build: .
    image: nw-overlap-app:latest
    container_name: nw-overlap-app
    # Restart on failure and come back automatically after a host reboot.
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5005}:5005"
    environment:
      # Optional: enables the BioGRID source when set.
      BIOGRID_KEY: "${BIOGRID_KEY:-}"
      NW_MAX_GENES: "${NW_MAX_GENES:-30}"
      NW_DISEASE_TOP_N: "${NW_DISEASE_TOP_N:-100}"
      NW_PPI_TOP_N: "${NW_PPI_TOP_N:-30}"
      NW_MAX_WORKERS: "${NW_MAX_WORKERS:-5}"
      NW_STRING_SCORE: "${NW_STRING_SCORE:-700}"
      NW_HUB_THRESHOLD: "${NW_HUB_THRESHOLD:-1000}"
      NW_MAX_NODES: "${NW_MAX_NODES:-100}"
      NW_ENRICH_GENE_N: "${NW_ENRICH_GENE_N:-100}"
      NW_ENRICH_MAX_TERMS: "${NW_ENRICH_MAX_TERMS:-50}"
      NW_SYMPTOM_LIST_N: "${NW_SYMPTOM_LIST_N:-50}"
      NW_SYMPTOM_MAX: "${NW_SYMPTOM_MAX:-20}"
      NW_SYMPTOM_GENES_PER: "${NW_SYMPTOM_GENES_PER:-50}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-2}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-8}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    volumes:
      # Keeps the SIGNOR/STRING/IntAct caches across restarts and rebuilds.
      - ppi-cache:/app/ppi_cache
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:5005/healthz", timeout=5).status == 200 else 1)
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ppi-cache:
