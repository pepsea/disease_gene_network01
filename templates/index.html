<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='8' r='4' fill='%232563eb'/%3E%3Ccircle cx='7' cy='23' r='4' fill='%2394a3b8'/%3E%3Ccircle cx='25' cy='23' r='4' fill='%2394a3b8'/%3E%3Cpath d='M16 8L7 23M16 8l9 15M7 23h18' stroke='%232563eb' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<title>NW重複評価 — Gene–Disease Network Overlap</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e2e5ea;
    --text: #1c2024;
    --muted: #6b7280;
    --accent: #2563eb;
    --strong: #15803d;
    --moderate: #b45309;
    --weak: #6b7280;
    --danger: #b91c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 20px 64px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
          "Noto Sans JP", Meiryo, sans-serif;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 24px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
  .hint { font-weight: 400; color: var(--muted); }
  input[type=text], textarea {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font: inherit;
    background: #fff;
    color: inherit;
  }
  textarea { resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  .field { margin-bottom: 16px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  button {
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 6px;
    padding: 10px 20px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #1d4ed8; }
  button:disabled { opacity: .55; cursor: progress; }
  button.secondary { background: #fff; color: var(--text); border: 1px solid var(--border); font-weight: 500; }
  button.secondary:hover:not(:disabled) { background: #f3f4f6; }
  #gene-count { font-size: 12px; color: var(--muted); }
  #gene-count.over { color: var(--danger); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); background: #fafbfc; }
  tbody tr:hover { background: #fafbfc; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .score { font-weight: 700; font-variant-numeric: tabular-nums; }
  .score.strong { color: var(--strong); }
  .score.moderate { color: var(--moderate); }
  .score.weak { color: var(--weak); }
  .bar { height: 4px; border-radius: 2px; background: #e5e7eb; margin-top: 4px; min-width: 60px; }
  .bar > span { display: block; height: 100%; border-radius: 2px; background: currentColor; }
  .partners { font-size: 12px; color: var(--muted); }
  .err { color: var(--danger); }
  .meta { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
  .meta strong { color: var(--text); font-size: 15px; }
  .legend { font-size: 12px; color: var(--muted); margin-top: 14px; }
  .legend b { color: var(--text); }
  .spinner {
    display: inline-block; width: 14px; height: 14px; border: 2px solid #cbd5e1;
    border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite;
    vertical-align: -2px; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .table-scroll { overflow-x: auto; }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a; --panel: #1c2024; --border: #2c3238; --text: #e8eaed;
      --muted: #9aa3ad; --accent: #4b83f0; --strong: #4ade80; --moderate: #fbbf24;
      --weak: #9aa3ad; --danger: #f87171;
    }
    input[type=text], textarea { background: #14171a; }
    th { background: #191d21; }
    tbody tr:hover { background: #191d21; }
    button.secondary:hover:not(:disabled) { background: #232830; }
    .bar { background: #2c3238; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>NW重複評価</h1>
  <p class="sub">Gene–Disease Network Overlap Evaluator — 遺伝子のPPIネットワークが、疾患のOpen Targets上位遺伝子群をどれだけカバーするかを評価します。</p>

  <div class="panel">
    <form id="form">
      <div class="field">
        <label for="disease">疾患名 <span class="hint">（英語名、または EFO_0000249 のようなオントロジーID）</span></label>
        <input id="disease" type="text" placeholder="例: Alzheimer disease" required autocomplete="off">
      </div>
      <div class="field">
        <label for="genes">遺伝子リスト <span class="hint">（1行1遺伝子 または カンマ区切り／最大 {{ max_genes }} 件）</span></label>
        <textarea id="genes" rows="6" placeholder="APP&#10;PSEN1&#10;APOE" required></textarea>
        <div id="gene-count">0 件</div>
      </div>
      <div class="row">
        <button id="submit" type="submit">解析実行</button>
        <button id="download" type="button" class="secondary" hidden>CSVダウンロード</button>
      </div>
    </form>
  </div>

  <div id="result"></div>
</div>

<script>
const MAX_GENES = {{ max_genes }};
const STRONG = {{ strong_threshold }};
const MODERATE = {{ moderate_threshold }};

const $ = (id) => document.getElementById(id);
let lastData = null;

function parseGenes(raw) {
  const seen = new Set();
  const genes = [];
  for (const token of raw.split(/[\s,;]+/)) {
    const g = token.trim();
    if (!g || seen.has(g.toUpperCase())) continue;
    seen.add(g.toUpperCase());
    genes.push(g);
  }
  return genes;
}

function updateCount() {
  const n = parseGenes($("genes").value).length;
  const el = $("gene-count");
  el.textContent = n + " 件" + (n > MAX_GENES ? "（上限 " + MAX_GENES + " 件を超えています）" : "");
  el.classList.toggle("over", n > MAX_GENES);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function band(score) {
  if (score >= STRONG) return "strong";
  if (score >= MODERATE) return "moderate";
  return "weak";
}

function render(data) {
  const bandLabel = { strong: "強い関連", moderate: "中程度", weak: "関連が薄い" };
  let html = '<div class="panel">';
  html += '<p class="meta"><strong>' + escapeHtml(data.disease_label) + "</strong>（"
        + escapeHtml(data.disease_id) + "）— 疾患上位遺伝子 " + data.disease_gene_count
        + " 件／PPIパートナー上限 " + data.ppi_top_n + " 件</p>";
  html += '<div class="table-scroll"><table><thead><tr>'
        + "<th>遺伝子</th><th>加重スコア</th><th>単純重複率</th><th>重複数</th>"
        + "<th>ターゲット自身</th><th>重複遺伝子（上位5件）</th>"
        + "</tr></thead><tbody>";

  for (const r of data.results) {
    if (r.error) {
      html += "<tr><td><strong>" + escapeHtml(r.gene) + "</strong></td>"
            + '<td colspan="5" class="err">' + escapeHtml(r.error) + "</td></tr>";
      continue;
    }
    const cls = band(r.weighted_score);
    const pct = Math.min(100, r.weighted_score * 100);
    const selfMark = r.target_self
      ? "★ " + escapeHtml(r.target_self) + " (" + Number(r.target_self_score).toFixed(3) + ")"
      : "—";
    const top = (r.overlapping_genes || []).slice(0, 5)
      .map((g) => escapeHtml(g.symbol) + "(" + Number(g.score).toFixed(3) + ")").join(", ");
    const more = (r.overlapping_genes || []).length - 5;

    html += "<tr>"
      + "<td><strong>" + escapeHtml(r.gene) + "</strong></td>"
      + '<td class="num"><span class="score ' + cls + '">' + r.weighted_score.toFixed(3) + "</span>"
      + '<div class="bar ' + cls + '" style="color:var(--' + cls + ')"><span style="width:' + pct + '%"></span></div>'
      + '<div class="partners">' + bandLabel[cls] + "</div></td>"
      + '<td class="num">' + (r.simple_ratio * 100).toFixed(1) + "%</td>"
      + '<td class="num">' + r.overlap_count + " / " + r.ppi_partner_count + " PPI</td>"
      + '<td class="num">' + selfMark + "</td>"
      + '<td class="partners">' + (top || "—") + (more > 0 ? " …他" + more + "件" : "") + "</td>"
      + "</tr>";
  }
  html += "</tbody></table></div>";
  html += '<p class="legend"><b>加重スコア</b> = （重複遺伝子のOTスコア合計 ＋ ターゲット自身のOTスコア）÷ 疾患遺伝子のOTスコア合計。'
        + " ≥ " + STRONG + " 強い関連／" + MODERATE + "〜" + STRONG + " 中程度／< " + MODERATE
        + " 関連が薄い（またはPPI情報不足）。</p>";
  html += "</div>";
  $("result").innerHTML = html;
}

function toCsv(data) {
  const rows = [["gene", "weighted_score", "simple_ratio", "overlap_count",
                 "ppi_partner_count", "disease_gene_count", "target_self",
                 "target_self_score", "overlapping_genes", "error"]];
  for (const r of data.results) {
    rows.push([
      r.gene, r.weighted_score ?? "", r.simple_ratio ?? "", r.overlap_count ?? "",
      r.ppi_partner_count ?? "", r.disease_gene_count ?? "", r.target_self ?? "",
      r.target_self_score ?? "",
      (r.overlapping_genes || []).map((g) => g.symbol + "(" + g.score + ")").join(" "),
      r.error ?? "",
    ]);
  }
  return rows.map((row) => row.map((c) => '"' + String(c).replace(/"/g, '""') + '"').join(",")).join("\n");
}

async function runAnalysis(e) {
  e.preventDefault();
  const disease = $("disease").value.trim();
  const genes = parseGenes($("genes").value);

  if (!disease || genes.length === 0) {
    $("result").innerHTML = '<div class="panel"><p class="err">疾患名と遺伝子リストの両方を入力してください。</p></div>';
    return;
  }
  if (genes.length > MAX_GENES) {
    $("result").innerHTML = '<div class="panel"><p class="err">遺伝子は最大 ' + MAX_GENES
      + " 件までです（" + genes.length + " 件入力されています）。</p></div>";
    return;
  }

  $("submit").disabled = true;
  $("download").hidden = true;
  $("result").innerHTML = '<div class="panel"><span class="spinner"></span>'
    + genes.length + " 遺伝子を解析中…（PPI取得に時間がかかる場合があります）</div>";

  try {
    const res = await fetch("/api/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ disease, genes }),
    });
    const data = await res.json();
    if (!res.ok || data.error) {
      $("result").innerHTML = '<div class="panel"><p class="err">'
        + escapeHtml(data.error || ("解析に失敗しました (HTTP " + res.status + ")")) + "</p></div>";
      return;
    }
    lastData = data;
    render(data);
    $("download").hidden = false;
  } catch (err) {
    $("result").innerHTML = '<div class="panel"><p class="err">通信エラー: '
      + escapeHtml(err.message) + "</p></div>";
  } finally {
    $("submit").disabled = false;
  }
}

$("form").addEventListener("submit", runAnalysis);
$("genes").addEventListener("input", updateCount);
$("download").addEventListener("click", () => {
  if (!lastData) return;
  const blob = new Blob(["﻿" + toCsv(lastData)], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "nw_overlap_" + lastData.disease_id + ".csv";
  a.click();
  URL.revokeObjectURL(a.href);
});
updateCount();
</script>
</body>
</html>
